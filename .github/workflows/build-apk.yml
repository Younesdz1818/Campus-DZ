
name: Build Campus DZ v7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(find . -name "Campus-DZ-v7-Spark-Supabase.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found!"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Find Flutter project
        id: project
        run: |
          FILE=$(find extracted -name pubspec.yaml | head -n 1)
          if [ -z "$FILE" ]; then
            echo "pubspec.yaml not found inside ZIP!"
            find extracted -maxdepth 3 -type f | head -n 50
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v7-APK
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk

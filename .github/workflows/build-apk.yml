
name: Build Campus DZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Campus DZ v2.1
        run: |
          unzip -q Campus-DZ-v2.1-source-fixed.zip -d source
          test -f source/CampusDZ_Android/app/build.gradle
          test -f source/CampusDZ_Android/app/google-services.json

      - name: Build APK
        run: |
          cd source/CampusDZ_Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v2.1-APK
          path: source/CampusDZ_Android/app/build/outputs/apk/debug/app-debug.apk
          

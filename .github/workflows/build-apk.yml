
name: Build Campus DZ v22 Favorites Delete APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PROJECT_ZIP: "Campus-DZ-v22-Library-Favorites-Delete-Android(1)(1)(1).zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "Android SDK not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare signing key
        env:
          CAMPUS_KEYSTORE_BASE64: ${{ secrets.CAMPUS_KEYSTORE_BASE64 }}
          CAMPUS_KEYSTORE_PASSWORD_SECRET: ${{ secrets.CAMPUS_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CAMPUS_KEYSTORE_BASE64" || { echo "Missing GitHub secret: CAMPUS_KEYSTORE_BASE64"; exit 1; }
          test -n "$CAMPUS_KEYSTORE_PASSWORD_SECRET" || { echo "Missing GitHub secret: CAMPUS_KEYSTORE_PASSWORD"; exit 1; }
          printf '%s' "$CAMPUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/campus-release.keystore"
          test -s "$RUNNER_TEMP/campus-release.keystore"
          echo "CAMPUS_KEYSTORE_FILE=$RUNNER_TEMP/campus-release.keystore" >> "$GITHUB_ENV"
          echo "CAMPUS_KEYSTORE_PASSWORD=$CAMPUS_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "CAMPUS_KEY_PASSWORD=$CAMPUS_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"

      - name: Verify and extract updated project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_ZIP" || {
            echo "Missing $PROJECT_ZIP in repository root. Upload the ZIP to the root of the GitHub repository."
            ls -lah
            exit 1
          }
          unzip -t "$PROJECT_ZIP"
          mkdir -p source
          unzip -q "$PROJECT_ZIP" -d source
          PROJECT_FILE=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$PROJECT_FILE" || { echo "Gradle settings file not found inside ZIP"; exit 1; }
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          test -f "$PROJECT_DIR/app/src/main/java/dz/campus/app/MainActivity.java" || { echo "MainActivity.java not found"; exit 1; }
          test -f "$PROJECT_DIR/app/src/main/assets/index.html" || { echo "index.html not found"; exit 1; }
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify library, PDF and interstitial ads
        shell: bash
        run: |
          set -euo pipefail

          JAVA_FILE="$PROJECT_DIR/app/src/main/java/dz/campus/app/MainActivity.java"
          HTML_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          # Library features
          grep -Fq 'libraryDelete' "$JAVA_FILE" || { echo "libraryDelete missing"; exit 1; }
          grep -Fq 'libraryFavoriteAdd' "$JAVA_FILE" || { echo "libraryFavoriteAdd missing"; exit 1; }
          grep -Fq 'libraryFavoriteRemove' "$JAVA_FILE" || { echo "libraryFavoriteRemove missing"; exit 1; }
          grep -Fq 'libraryFavoriteList' "$JAVA_FILE" || { echo "libraryFavoriteList missing"; exit 1; }

          # Internal PDF viewer
          grep -Fq 'openLibraryPdf' "$JAVA_FILE" || { echo "Internal PDF bridge missing"; exit 1; }
          grep -Fq 'PdfRenderer' "$JAVA_FILE" || { echo "PdfRenderer missing"; exit 1; }

          # Library interface
          grep -Fq 'data-lib-delete' "$HTML_FILE" || { echo "Delete button missing"; exit 1; }
          grep -Fq 'data-lib-favorite' "$HTML_FILE" || { echo "Favorite button missing"; exit 1; }

          # Interstitial ads every 5 PDF page turns
          grep -Fq 'pdfPageTurnsSinceAd' "$JAVA_FILE" || { echo "PDF ad counter missing"; exit 1; }
          grep -Fq 'onInternalPdfPageTurned' "$JAVA_FILE" || { echo "PDF page turn ad handler missing"; exit 1; }
          grep -Fq 'pdfPageTurnsSinceAd >= 5' "$JAVA_FILE" || { echo "5-page ad frequency missing"; exit 1; }
          grep -Fq 'maybeShowInterstitial' "$JAVA_FILE" || { echo "Interstitial display method missing"; exit 1; }
          grep -Fq 'onAdDismissedFullScreenContent' "$JAVA_FILE" || { echo "Ad reload callback missing"; exit 1; }

          echo "All library, PDF and interstitial ad checks passed."

      - name: Build signed APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon clean assembleRelease bundleRelease

      - name: Collect APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-output"
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)
          AAB=$(find "$PROJECT_DIR/app/build/outputs/bundle/release" -type f -name '*.aab' -print -quit)
          test -n "$APK" || { echo "Release APK not found"; exit 1; }
          test -n "$AAB" || { echo "Release AAB not found"; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/release-output/Campus-DZ-v22-release.apk"
          cp "$AAB" "$GITHUB_WORKSPACE/release-output/Campus-DZ-v22-release.aab"
          ls -lh "$GITHUB_WORKSPACE/release-output"

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v22-Favorites-Delete-APK-AAB
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

name: Build Campus DZ v22 Diagnostic APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. إعداد Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. تثبيت Android SDK 35
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses

      # 6. استخراج مشروع Campus DZ v22 التشخيصي
      - name: Extract Campus DZ v22 Diagnostic
        run: |
          ZIP_FILE="Campus-DZ-v22-Library-Diagnostic.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          if [ ! -f "source/CampusDZ_Android/app/build.gradle" ]; then
            echo "ERROR: Android project not found inside ZIP"
            find source -maxdepth 3 -type f | head -50
            exit 1
          fi

      # 7. إعداد مفتاح التوقيع
      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CAMPUS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: CAMPUS_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/campus-release.keystore"

          if [ ! -s "$RUNNER_TEMP/campus-release.keystore" ]; then
            echo "ERROR: Keystore file is empty"
            exit 1
          fi

      # 8. بناء APK و AAB
      - name: Build Release APK and AAB
        working-directory: source/CampusDZ_Android
        env:
          CAMPUS_KEYSTORE_FILE: ${{ runner.temp }}/campus-release.keystore
          CAMPUS_KEYSTORE_PASSWORD: ${{ secrets.CAMPUS_KEYSTORE_PASSWORD }}
          CAMPUS_KEY_PASSWORD: ${{ secrets.CAMPUS_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease bundleRelease

      # 9. تجهيز ملفات الإصدار
      - name: Prepare release files
        run: |
          mkdir -p release

          cp source/CampusDZ_Android/app/build/outputs/apk/release/*.apk release/
          cp source/CampusDZ_Android/app/build/outputs/bundle/release/*.aab release/

          ls -lh release/

      # 10. رفع APK و AAB
      - name: Upload Campus DZ v22 Release
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v22-Diagnostic-Release
          path: release/
          if-no-files-found: error
          retention-days: 30

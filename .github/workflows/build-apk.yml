name: Build Campus DZ APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Campus-DZ-v7-Upload-ZIP-Only.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (without setup-android action)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found in Android SDK installation"
            exit 1
          fi
          # sdkmanager may close the pipe after reading all answers. In that case
          # yes exits with SIGPIPE (141), which is expected; check sdkmanager's
          # own exit code instead of treating yes's SIGPIPE as a build failure.
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${license_status[1]}" -ne 0 ]]; then
            echo "Android SDK license acceptance failed (sdkmanager exit: ${license_status[1]})"
            exit "${license_status[1]}"
          fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Campus-DZ-v7-Upload-ZIP-Only.zip"
          test -f "$ZIP_FILE" || { echo "Missing $ZIP_FILE in repository root"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR" || { echo "settings.gradle not found inside ZIP"; find extracted -maxdepth 4 -type f | head -80; exit 1; }
          test -f "$PROJECT_DIR/app/build.gradle" || { echo "app/build.gradle not found in $PROJECT_DIR"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Prepare APK artifact
        run: |
          set -euo pipefail
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH" || { echo "APK output not found: $APK_PATH"; exit 1; }
          mkdir -p build-output
          cp "$APK_PATH" build-output/Campus-DZ-v7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-APK
          path: build-output/Campus-DZ-v7.apk
          if-no-files-found: error

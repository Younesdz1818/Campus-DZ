
name: Build Campus DZ v22 APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. تجهيز مفتاح التوقيع
      - name: Prepare signing key
        env:
          CAMPUS_KEYSTORE_BASE64: ${{ secrets.CAMPUS_KEYSTORE_BASE64 }}
          CAMPUS_KEYSTORE_PASSWORD: ${{ secrets.CAMPUS_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -e

          test -n "$CAMPUS_KEYSTORE_BASE64" || {
            echo "ERROR: CAMPUS_KEYSTORE_BASE64 is missing"
            exit 1
          }

          test -n "$CAMPUS_KEYSTORE_PASSWORD" || {
            echo "ERROR: CAMPUS_KEYSTORE_PASSWORD is missing"
            exit 1
          }

          echo "$CAMPUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/campus-release.keystore"

          test -s "$RUNNER_TEMP/campus-release.keystore"

          echo "CAMPUS_KEYSTORE_FILE=$RUNNER_TEMP/campus-release.keystore" >> "$GITHUB_ENV"
          echo "CAMPUS_KEYSTORE_PASSWORD=$CAMPUS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CAMPUS_KEY_PASSWORD=$CAMPUS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

          echo "Signing key prepared."

      # 5. تحديد Android SDK
      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # 6. تثبيت Android SDK
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

          echo "Android SDK installed."

      # 7. التحقق من ملف المشروع
      - name: Verify project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="Campus-DZ-v22-Library-Admin-Interface-Fixed.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root"
            ls -lah
            exit 1
          fi

          echo "Campus DZ v22 ZIP found."

      # 8. استخراج المشروع
      - name: Extract Campus DZ
        shell: bash
        run: |
          set -e

          mkdir -p source

          unzip -q Campus-DZ-v22-Library-Admin-Interface-Fixed.zip -d source

          PROJECT_DIR=$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found"
            find source -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      # 9. التحقق من ملفات Android
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "ERROR: google-services.json not found"
            exit 1
          fi

          echo "Android project verified."

      # 10. بناء APK و AAB
      - name: Build signed APK and AAB
        shell: bash
        run: |
          set -e

          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            clean \
            assembleRelease \
            bundleRelease

          echo "Build completed."

      # 11. جمع ملفات الإصدار
      - name: Collect APK and AAB
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)

          AAB=$(find "$PROJECT_DIR/app/build/outputs/bundle" \
            -type f -name '*.aab' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not generated"
            exit 1
          fi

          cp "$APK" release/Campus-DZ-v22.apk
          cp "$AAB" release/Campus-DZ-v22.aab

          echo "Release files collected:"
          ls -lh release/

      # 12. رفع APK و AAB
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v22-Release
          path: release/*
          if-no-files-found: error
          retention-days: 30


name: Build Campus DZ v20

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. العثور على Android SDK و sdkmanager
      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 5 -type d
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Found SDK manager:"
          echo "$SDKMANAGER"

      # 5. تثبيت تراخيص ومكونات Android
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --version

          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      # 6. التأكد من وجود ملف v20
      - name: Verify ZIP
        run: |
          echo "Repository files:"
          ls -lah

          if [ ! -f "Campus-DZ-v20-Native-LostFound.zip" ]; then
            echo "ERROR: Campus-DZ-v20-Native-LostFound.zip not found"
            exit 1
          fi

      # 7. استخراج المشروع
      - name: Extract Campus DZ v20
        run: |
          mkdir -p source

          unzip -o Campus-DZ-v20-Native-LostFound.zip -d source

          echo "Extracted files:"
          find source -maxdepth 4 -type f | head -100

      # 8. العثور على مجلد مشروع Android
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find source -type f -name gradlew \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      # 9. التحقق من ملفات المشروع
      - name: Verify project
        run: |
          echo "Project structure:"
          ls -lah "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle project files not found"
            exit 1
          fi

      # 10. بناء APK و AAB
      - name: Build APK and AAB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            gradle --no-daemon assembleRelease bundleRelease
          fi

      # 11. جمع ملفات البناء
      - name: Collect build outputs
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/release"

          find "$PROJECT_DIR" -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp {} "$GITHUB_WORKSPACE/release/" \;

          echo "Build outputs:"
          ls -lh "$GITHUB_WORKSPACE/release"

          if [ -z "$(find "$GITHUB_WORKSPACE/release" -type f)" ]; then
            echo "ERROR: No APK or AAB generated"
            exit 1
          fi

      # 12. رفع الملفات
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v20
          path: release/*
          if-no-files-found: error
          retention-days: 30

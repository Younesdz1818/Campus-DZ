
name: Build Campus DZ v7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Campus DZ v7
        run: |
          ZIP=$(find . -name "Campus-DZ-v7-Spark-Supabase.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses

      - name: Check project files
        run: |
          ls -la extracted/CampusDZ_Android
          test -f extracted/CampusDZ_Android/gradlew

      - name: Build APK
        working-directory: extracted/CampusDZ_Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v7-APK
          path: extracted/CampusDZ_Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

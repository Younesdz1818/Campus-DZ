name: Build Campus DZ APK from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Campus-DZ-v7-Supabase-Reviewed.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "لم يتم العثور على $ZIP_FILE في جذر المستودع. ارفع ملف ZIP إلى الصفحة الرئيسية للمستودع أولاً."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          if [[ ! -f extracted/CampusDZ_Android/settings.gradle || ! -f extracted/CampusDZ_Android/app/build.gradle ]]; then
            echo "محتويات ZIP لا تحتوي على CampusDZ_Android كما هو متوقع."
            find extracted -maxdepth 3 -type f | head -80
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p extracted/CampusDZ_Android --no-daemon assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p build-output
          cp extracted/CampusDZ_Android/app/build/outputs/apk/debug/app-debug.apk build-output/Campus-DZ-v7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-APK
          path: build-output/Campus-DZ-v7.apk
          if-no-files-found: error

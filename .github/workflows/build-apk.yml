
name: Build Campus DZ APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Campus-DZ-Supabase-connected-source-v2.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          if [ ! -f "Campus-DZ-Supabase-connected-source-v2.zip" ]; then
            echo "ZIP file not found in repository root"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        run: |
          unzip -q "Campus-DZ-Supabase-connected-source-v2.zip" -d source

      - name: Find Android project
        run: |
          SETTINGS=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

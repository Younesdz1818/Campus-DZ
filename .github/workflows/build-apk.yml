
name: Build Campus DZ APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Firebase Verification package
        run: |
          unzip -q CampusDZ_Firebase_Verification_v2.0.zip -d package
          unzip -q package/CampusDZ_Firebase_Verification_v2.0/CampusDZ_Digital_Student_Card_v1.5.zip -d extracted

      - name: Add Firebase config
        run: cp google-services.json extracted/CampusDZ_Android/app/google-services.json

      - name: Build APK
        run: |
          cd extracted/CampusDZ_Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-APK-v2
          path: extracted/CampusDZ_Android/app/build/outputs/apk/debug/app-debug.apk

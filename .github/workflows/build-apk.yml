name: Build Campus DZ v22 - Banner Fix APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PROJECT_ZIP: "Campus-DZ-v22-AdMob-Banner-Fix.zip"
  GRADLE_VERSION: "8.9"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_ZIP" ]; then
            echo "ERROR: Missing $PROJECT_ZIP in repository root."
            echo "Files available:"
            ls -lah
            exit 1
          fi

          echo "ZIP file found:"
          ls -lh "$PROJECT_ZIP"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

          PROJECT_DIR="extracted/CampusDZ_Android"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project extracted successfully."

      - name: Prepare release signing
        shell: bash
        env:
          CAMPUS_KEYSTORE_BASE64: ${{ secrets.CAMPUS_KEYSTORE_BASE64 }}
          CAMPUS_KEYSTORE_PASSWORD: ${{ secrets.CAMPUS_KEYSTORE_PASSWORD }}
          CAMPUS_KEY_PASSWORD: ${{ secrets.CAMPUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$CAMPUS_KEYSTORE_BASE64" ] && [ -n "$CAMPUS_KEYSTORE_PASSWORD" ]; then
            echo "$CAMPUS_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/campus-release.keystore"

            echo "CAMPUS_KEYSTORE_FILE=$PROJECT_DIR/campus-release.keystore" >> "$GITHUB_ENV"
            echo "CAMPUS_KEYSTORE_PASSWORD=$CAMPUS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

            if [ -n "$CAMPUS_KEY_PASSWORD" ]; then
              echo "CAMPUS_KEY_PASSWORD=$CAMPUS_KEY_PASSWORD" >> "$GITHUB_ENV"
            else
              echo "CAMPUS_KEY_PASSWORD=$CAMPUS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            fi

            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
            echo "Release signing is configured."
          else
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "No release keystore secrets found. Debug build will be generated."
          fi

      - name: Build APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ "$BUILD_TYPE" = "release" ]; then
            gradle --no-daemon clean assembleRelease bundleRelease
          else
            gradle --no-daemon clean assembleDebug bundleDebug
          fi

      - name: Collect APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          if [ -z "$(find "$GITHUB_WORKSPACE/output" -type f)" ]; then
            echo "ERROR: No APK or AAB files were generated."
            exit 1
          fi

          echo "Generated files:"
          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v22-APK-AAB
          path: output/*
          if-no-files-found: error
          retention-days: 30


name: Build Campus DZ v7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Campus DZ v7
        run: |
          ZIP="Campus-DZ-v7-Spark-Supabase.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found in repository root"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project
        run: |
          ls -la extracted/CampusDZ_Android
          test -f extracted/CampusDZ_Android/settings.gradle
          test -f extracted/CampusDZ_Android/build.gradle
          test -f extracted/CampusDZ_Android/app/build.gradle

      - name: Build APK
        working-directory: extracted/CampusDZ_Android
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v7-APK
          path: extracted/CampusDZ_Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
          

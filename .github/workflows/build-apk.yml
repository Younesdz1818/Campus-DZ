
name: Build Campus DZ APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true
          set -o pipefail

      - name: Install SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Inspect ZIP contents
        run: |
          echo "=== ZIP CONTENTS ==="
          unzip -l Campus-DZ-v8-News-Update.zip | head -80
          echo "=== SEARCH FOR GRADLE FILES ==="
          unzip -Z1 Campus-DZ-v8-News-Update.zip | grep -E '(^|/)(gradlew|settings.gradle|settings.gradle.kts)$' || true

      - name: Extract source ZIP
        run: |
          unzip -q Campus-DZ-v8-News-Update.zip -d source

      - name: Locate Android project
        run: |
          GRADLEW=$(find source -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            echo "The ZIP may not contain the complete Android project."
            find source -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Android project found: $PROJECT_DIR"

      - name: Configure Firebase
        run: |
          if [ -f google-services.json ] && [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            mkdir -p "$PROJECT_DIR/app"
            cp google-services.json "$PROJECT_DIR/app/google-services.json"
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk


name: Build Campus DZ v16 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v16 project
        run: |
          ZIP_FILE="Campus-DZ-v16.zip"
          test -f "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CAMPUS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p extracted/CampusDZ_Android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > extracted/CampusDZ_Android/app/campus-release.keystore
          test -s extracted/CampusDZ_Android/app/campus-release.keystore

      - name: Build Release APK
        working-directory: extracted/CampusDZ_Android
        env:
          CAMPUS_KEYSTORE_FILE: campus-release.keystore
          CAMPUS_KEYSTORE_PASSWORD: ${{ secrets.CAMPUS_KEYSTORE_PASSWORD }}
          CAMPUS_KEY_PASSWORD: ${{ secrets.CAMPUS_KEYSTORE_PASSWORD }}
        run: |
          gradle assembleRelease

      - name: Rename APK
        run: |
          APK=$(find extracted/CampusDZ_Android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" Campus-DZ-v16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v16-APK
          path: Campus-DZ-v16.apk

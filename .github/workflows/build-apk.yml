
name: Build Campus DZ v7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Campus DZ v7
        run: |
          ZIP=$(find . -name "Campus-DZ-v7-Spark-Supabase.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK
        working-directory: extracted/CampusDZ_Android
        run: |
          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v7-APK
          path: extracted/CampusDZ_Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

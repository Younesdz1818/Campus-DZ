
name: Build Campus DZ v15 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          CAMPUS_KEYSTORE_BASE64: ${{ secrets.CAMPUS_KEYSTORE_BASE64 }}
          CAMPUS_KEYSTORE_PASSWORD: ${{ secrets.CAMPUS_KEYSTORE_PASSWORD }}
        run: |
          test -n "$CAMPUS_KEYSTORE_BASE64" || {
            echo "Missing keystore secret"
            exit 1
          }

          test -n "$CAMPUS_KEYSTORE_PASSWORD" || {
            echo "Missing keystore password"
            exit 1
          }

          echo "$CAMPUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/campus-release.keystore"

          echo "CAMPUS_KEYSTORE_FILE=$RUNNER_TEMP/campus-release.keystore" >> "$GITHUB_ENV"
          echo "CAMPUS_KEYSTORE_PASSWORD=$CAMPUS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CAMPUS_KEY_PASSWORD=$CAMPUS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Extract v15 project
        run: |
          ZIP_FILE="Campus-DZ-v15-UI.zip"

          test -f "$ZIP_FILE" || {
            echo "v15 ZIP file not found: $ZIP_FILE"
            exit 1
          }

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_FILE=$(find source \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          test -n "$PROJECT_FILE" || {
            echo "Android project settings.gradle not found"
            exit 1
          }

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon assembleRelease

          mkdir -p build-output

          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" \
             build-output/Campus-DZ-v15.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v15-APK
          path: build-output/Campus-DZ-v15.apk
          if-no-files-found: error

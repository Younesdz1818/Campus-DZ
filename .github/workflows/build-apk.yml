
name: Build Campus DZ APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Campus-DZ-GitHub-Ready-Complete.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          test -f "Campus-DZ-GitHub-Ready-Complete.zip"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: |
          unzip -q "Campus-DZ-GitHub-Ready-Complete.zip" -d source

      - name: Find Android project
        id: project
        run: |
          SETTINGS=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" --no-daemon assembleDebug
          mkdir -p output
          cp "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" output/Campus-DZ.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-APK
          path: output/Campus-DZ.apk
          if-no-files-found: error
          


name: Build Campus DZ v7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Flutter project
        id: project
        run: |
          FILE=$(find . -name pubspec.yaml -not -path '*/.dart_tool/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project found: $DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v7-APK
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk

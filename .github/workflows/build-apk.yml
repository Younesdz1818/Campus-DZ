
name: Build Campus DZ v22 PDF Fixed APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          CAMPUS_KEYSTORE_BASE64: ${{ secrets.CAMPUS_KEYSTORE_BASE64 }}
          CAMPUS_KEYSTORE_PASSWORD: ${{ secrets.CAMPUS_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -e
          test -n "$CAMPUS_KEYSTORE_BASE64"
          test -n "$CAMPUS_KEYSTORE_PASSWORD"

          echo "$CAMPUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/campus-release.keystore"
          test -s "$RUNNER_TEMP/campus-release.keystore"

          echo "CAMPUS_KEYSTORE_FILE=$RUNNER_TEMP/campus-release.keystore" >> "$GITHUB_ENV"
          echo "CAMPUS_KEYSTORE_PASSWORD=$CAMPUS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CAMPUS_KEY_PASSWORD=$CAMPUS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)
          test -n "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Verify project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="Campus-DZ-v22-PDF-FileID-Fixed.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: New fixed ZIP not found in repository root"
            ls -lah
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          echo "Project ZIP verified."

      - name: Extract Campus DZ
        shell: bash
        run: |
          set -e
          ZIP_FILE="Campus-DZ-v22-PDF-FileID-Fixed.zip"

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_FILE=$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle project not found in ZIP"
            find source -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Verify Android project and PDF file ID fix
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/google-services.json"

          if grep -R -n "functions/v1/clever-responder" \
            "$PROJECT_DIR/app/src/main"; then
            echo "ERROR: Old endpoint still exists"
            exit 1
          fi

          if ! grep -R -n "functions/v1/library-api" \
            "$PROJECT_DIR/app/src/main"; then
            echo "ERROR: library-api endpoint not found"
            exit 1
          fi

          if ! grep -R -n "safeFileId" \
            "$PROJECT_DIR/app/src/main/java"; then
            echo "ERROR: PDF file ID validation is missing"
            exit 1
          fi

          if ! grep -R -n "f.file_id" \
            "$PROJECT_DIR/app/src/main/assets"; then
            echo "ERROR: Library file ID fallback is missing"
            exit 1
          fi

          echo "Android project and PDF file ID checks passed."

      - name: Build signed APK and AAB
        shell: bash
        run: |
          set -e
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            clean \
            assembleRelease \
            bundleRelease

      - name: Collect APK and AAB
        shell: bash
        run: |
          set -e
          mkdir -p release

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)

          AAB=$(find "$PROJECT_DIR/app/build/outputs/bundle" \
            -type f -name '*.aab' -print -quit)

          test -n "$APK"
          test -n "$AAB"

          cp "$APK" release/Campus-DZ-v22-PDF-Fixed.apk
          cp "$AAB" release/Campus-DZ-v22-PDF-Fixed.aab

          ls -lh release/

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-v22-PDF-Fixed-Release
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase library-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -e

          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "ERROR: SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          }

          test -n "$SUPABASE_PROJECT_REF" || {
            echo "ERROR: SUPABASE_PROJECT_REF is missing"
            exit 1
          }

          supabase functions deploy library-api \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --yes

          echo "library-api deployed successfully."

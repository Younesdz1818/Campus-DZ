
name: Build Campus DZ APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q CampusDZ_Profile_Photo_Circular.zip -d extracted
      - name: Build APK
        run: |
          cd extracted/CampusDZ_Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Campus-DZ-APK
          path: extracted/CampusDZ_Android/app/build/outputs/apk/debug/app-debug.apk
          
